name: Test, build image, deploy

on:
  push:
    branches: [main]

env:
  IMAGE: git.marlin-peacock.ts.net/afv/airflow

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - run: uv run pytest

  # Only runs when something that feeds the image changed. The registry
  # build cache means a rebuild with an unchanged lock is cheap anyway, but
  # skipping the job outright keeps DAG-only pushes fast.
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.check.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          before='${{ github.event.before }}'
          if [ -z "$before" ] || ! git cat-file -e "$before" 2>/dev/null; then
            # First push, force push, or unknown base: assume the image is stale.
            echo "image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "$before" "${{ github.sha }}" -- \
               pyproject.toml uv.lock Dockerfile .dockerignore; then
            echo "image=false" >> "$GITHUB_OUTPUT"
          else
            echo "image=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [test, changes]
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the Forgejo registry
        uses: docker/login-action@v3
        with:
          registry: git.marlin-peacock.ts.net
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      # The runner builds inside docker-in-docker, so local layer cache does
      # not survive between jobs. The :buildcache tag holds it in the
      # registry instead.
      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  # The SSH key is bound to a forced command on the server (installed by
  # Ansible) that pulls the DAG checkout, pulls the image, and runs
  # `compose up`. Compose only recreates containers whose image changed, so
  # a DAG-only deploy touches nothing but the working tree.
  deploy:
    needs: [test, build]
    # build is skipped on DAG-only pushes; that must not skip deploy too.
    if: always() && needs.test.result == 'success' && needs.build.result != 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ vars.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Run deploy script on server
        run: ssh -i ~/.ssh/deploy_key ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
