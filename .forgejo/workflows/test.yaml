name: Tests

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: docker
    container:
      image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest
        run: uv run pytest
